[project]
name = "ghostwriter"
version = "0.2.0"
description = "A mouse-friendly terminal prompt composer for Pi"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pi", "terminal", "prompt-editor", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
authors = [
    { name = "oblivion113", email = "abdousalamadan1993@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.11.5",
    "textual>=8.2.8",
    "textual-image>=0.13.2",
]

[project.scripts]
ghostwriter = "ghostwriter:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
